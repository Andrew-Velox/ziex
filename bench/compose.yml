name: "ziex_bench"

services:
  nextjs:
    image: ziex_bench-nextjs
    build:
      context: ./nextjs
      cache_from:
        - type=gha,scope=nextjs
      cache_to:
        - type=gha,mode=max,scope=nextjs
    environment:
      - NODE_ENV=production
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/ssr"]
      interval: 1s
      timeout: 2s
      retries: 15
      start_period: 5s
    cpuset: "0,1"
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
    networks:
      - bench-net

  solidjs:
    image: ziex_bench-solidjs
    build:
      context: ./solidjs
      cache_from:
        - type=gha,scope=solidjs
      cache_to:
        - type=gha,mode=max,scope=solidjs
    environment:
      - NODE_ENV=production
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/ssr"]
      interval: 1s
      timeout: 2s
      retries: 15
      start_period: 5s
    cpuset: "0,1"
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
    networks:
      - bench-net

  leptos:
    image: ziex_bench-leptos
    build:
      context: ./leptos
      cache_from:
        - type=gha,scope=leptos
      cache_to:
        - type=gha,mode=max,scope=leptos
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/ssr"]
      interval: 1s
      timeout: 2s
      retries: 15
      start_period: 5s
    cpuset: "0,1"
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
    networks:
      - bench-net

  dioxus:
    image: ziex_bench-dioxus
    build:
      context: ./dioxus
      cache_from:
        - type=gha,scope=dioxus
      cache_to:
        - type=gha,mode=max,scope=dioxus
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/ssr"]
      interval: 1s
      timeout: 2s
      retries: 15
      start_period: 5s
    cpuset: "0,1"
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
    networks:
      - bench-net

  ziex:
    image: ziex_bench-ziex
    build:
      context: ../
      dockerfile: bench/ziex/Dockerfile
      cache_from:
        - type=gha,scope=ziex
      cache_to:
        - type=gha,mode=max,scope=ziex
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/ssr"]
      interval: 1s
      timeout: 2s
      retries: 15
      start_period: 5s
    cpuset: "0,1"
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
    networks:
      - bench-net

  jetzig:
    image: ziex_bench-jetzig
    build:
      context: ./jetzig
      cache_from:
        - type=gha,scope=jetzig
      cache_to:
        - type=gha,mode=max,scope=jetzig
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/ssr"]
      interval: 1s
      timeout: 2s
      retries: 15
      start_period: 5s
    cpuset: "0,1"
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
    networks:
      - bench-net

  bench:
    image: ziex_bench-bench
    build:
      context: ../
      dockerfile: bench/Dockerfile.bench
      cache_from:
        - type=gha,scope=bench
      cache_to:
        - type=gha,mode=max,scope=bench
    # depends_on removed to allow selective startup
    cpuset: "2,3"
    networks:
      - bench-net

networks:
  bench-net:
    driver: bridge
