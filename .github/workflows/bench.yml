name: Benchmark

on:
  workflow_dispatch:
    inputs:
      frameworks:
        description: 'Frameworks to benchmark (space-separated, default: all)'
        required: false
        default: ''

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        include:
          - framework: nextjs
            context: bench/nextjs
          - framework: solidjs
            context: bench/solidjs
          - framework: leptos
            context: bench/leptos
          - framework: dioxus
            context: bench/dioxus
          - framework: jetzig
            context: bench/jetzig
          - framework: ziex
            context: .
            file: bench/ziex/Dockerfile
          - framework: bench
            context: bench
            file: bench/Dockerfile.bench
    defaults:
      run:
        shell: bash
    steps:
      - name: Check if framework is selected
        id: check
        run: |
          INPUT="${{ github.event.inputs.frameworks }}"
          FW="${{ matrix.framework }}"
          if [ -z "$INPUT" ] || [ "$FW" = "bench" ] || echo "$INPUT" | grep -qw "$FW"; then
            echo "skip=false" >> $GITHUB_OUTPUT
          else
            echo "skip=true" >> $GITHUB_OUTPUT
          fi

      - name: Checkout repository
        if: steps.check.outputs.skip == 'false'
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        if: steps.check.outputs.skip == 'false'
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: network=host

      - name: Build ${{ matrix.framework }}
        if: steps.check.outputs.skip == 'false'
        uses: docker/build-push-action@v6
        env:
          DOCKER_BUILD_SUMMARY: false
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          load: true
          tags: ziex_bench-${{ matrix.framework }}:latest
          cache-from: type=gha,scope=${{ matrix.framework }}
          cache-to: type=gha,mode=max,scope=${{ matrix.framework }}

      - name: Export image as tarball
        if: steps.check.outputs.skip == 'false'
        run: docker save ziex_bench-${{ matrix.framework }}:latest | gzip > /tmp/${{ matrix.framework }}.tar.gz

      - name: Upload image artifact
        if: steps.check.outputs.skip == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: image-${{ matrix.framework }}
          path: /tmp/${{ matrix.framework }}.tar.gz
          retention-days: 1

  bench:
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all image artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: image-*
          path: /tmp/images
          merge-multiple: true

      - name: Load Docker images
        run: |
          for f in /tmp/images/*.tar.gz; do
            echo "Loading $f"
            docker load < "$f"
          done

      - name: Run benchmark script
        id: bench
        working-directory: bench
        run: |
          chmod +x run.sh
          if [ -n "${{ github.event.inputs.frameworks }}" ]; then
            ./run.sh ${{ github.event.inputs.frameworks }}
          else
            ./run.sh
          fi
        env:
          DOCKER_BUILDKIT: 1

      - name: Upload result.csv artifact
        uses: actions/upload-artifact@v4
        with:
          name: bench-results
          path: bench/result.csv

      - name: Print result.csv to GitHub output
        id: print-result
        run: |
          echo 'Benchmark Results:'
          cat bench/result.csv
          echo "results<<EOF" >> $GITHUB_OUTPUT
          cat bench/result.csv >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Print summary
        run: |
          {
            echo "## Benchmark Results"
            echo ""
            echo "| Framework | Req/s | P50 (ms) | P99 (ms) | Idle (MB) | Peak (MB) | Image (MB) | Binary (MB) | Cold Start (ms) | Avg CPU (%) | Peak CPU (%) | Build (s) |"
            echo "|-----------|------:|---------:|---------:|----------:|----------:|-----------:|------------:|----------------:|------------:|-------------:|----------:|"
            tail -n +2 bench/result.csv | while IFS=',' read -r fw idle peak build_time img_mb bin_mb cold_ms cpu_avg cpu_peak rps p50 p99; do
              case "$fw" in
                ziex) label="Ziex" ;;
                jetzig) label="Jetzig" ;;
                leptos) label="Leptos" ;;
                dioxus) label="Dioxus" ;;
                solidjs) label="SolidStart" ;;
                nextjs) label="Next.js" ;;
                *) label="$fw" ;;
              esac
              printf "| %s | %.0f | %.2f | %.2f | %.1f | %.1f | %.0f | %s | %.0f | %.1f | %.1f | %.0f |\n" \
                "$label" "$rps" "$p50" "$p99" "$idle" "$peak" "$img_mb" "$bin_mb" "$cold_ms" "$cpu_avg" "$cpu_peak" "$build_time"
            done
          } >> $GITHUB_STEP_SUMMARY
