name: Benchmark

on:
  workflow_dispatch:
    inputs:
      frameworks:
        description: 'Frameworks to benchmark (space-separated, default: all)'
        required: false
        default: ''

jobs:
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: network=host

      - name: Determine frameworks to build
        id: frameworks
        run: |
          if [ -n "${{ github.event.inputs.frameworks }}" ]; then
            echo "list=${{ github.event.inputs.frameworks }}" >> $GITHUB_OUTPUT
          else
            echo "list=nextjs solidjs leptos dioxus jetzig ziex" >> $GITHUB_OUTPUT
          fi

      - name: Build images in parallel
        working-directory: bench
        run: |
          docker compose build --parallel ${{ steps.frameworks.outputs.list }} bench
        env:
          DOCKER_BUILDKIT: 1
          # Drive the build through buildx/bake so the per-service GHA
          # cache_from/cache_to scopes in compose.yml take effect.
          COMPOSE_BAKE: "true"

      - name: Run benchmark script
        id: bench
        working-directory: bench
        run: |
          chmod +x run.sh
          if [ -n "${{ github.event.inputs.frameworks }}" ]; then
            ./run.sh ${{ github.event.inputs.frameworks }}
          else
            ./run.sh
          fi
        env:
          DOCKER_BUILDKIT: 1

      - name: Upload result.csv artifact
        uses: actions/upload-artifact@v4
        with:
          name: bench-results
          path: bench/result.csv

      - name: Print result.csv to GitHub output
        id: print-result
        run: |
          echo 'Benchmark Results:'
          cat bench/result.csv
          echo "results<<EOF" >> $GITHUB_OUTPUT
          cat bench/result.csv >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Print summary
        run: |
          {
            echo "## Benchmark Results"
            echo ""
            echo "| Framework | Req/s | P50 (ms) | P99 (ms) | Idle (MB) | Peak (MB) | Image (MB) | Binary (MB) | Cold Start (ms) | Avg CPU (%) | Peak CPU (%) | Build (s) |"
            echo "|-----------|------:|---------:|---------:|----------:|----------:|-----------:|------------:|----------------:|------------:|-------------:|----------:|"
            tail -n +2 bench/result.csv | while IFS=',' read -r fw idle peak build_time img_mb bin_mb cold_ms cpu_avg cpu_peak rps p50 p99; do
              case "$fw" in
                ziex) label="Ziex" ;;
                jetzig) label="Jetzig" ;;
                leptos) label="Leptos" ;;
                dioxus) label="Dioxus" ;;
                solidjs) label="SolidStart" ;;
                nextjs) label="Next.js" ;;
                *) label="$fw" ;;
              esac
              printf "| %s | %.0f | %.2f | %.2f | %.1f | %.1f | %.0f | %s | %.0f | %.1f | %.1f | %.0f |\n" \
                "$label" "$rps" "$p50" "$p99" "$idle" "$peak" "$img_mb" "$bin_mb" "$cold_ms" "$cpu_avg" "$cpu_peak" "$build_time"
            done
          } >> $GITHUB_STEP_SUMMARY
